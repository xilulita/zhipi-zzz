<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>紫微星</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:transparent}
/* 允许拖动窗口：闪屏是无边框窗口，靠这块区域移动 */
body{-webkit-app-region:drag}
.wrap{position:relative;width:100%;height:100%;margin:0;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 24% 12%,rgba(255,255,255,.18),transparent 30%),linear-gradient(135deg,#3836a8 0%,#5a46ce 46%,#8c5ce2 100%);border:1px solid rgba(255,255,255,.16);border-radius:24px;overflow:hidden;box-shadow:0 22px 70px rgba(30,24,92,.38)}
.wrap:before,.wrap:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}
.wrap:before{width:280px;height:280px;right:-110px;top:-130px;background:rgba(255,255,255,.11)}
.wrap:after{width:240px;height:240px;left:-120px;bottom:-130px;background:rgba(34,25,111,.26)}
.main{position:relative;z-index:1;display:flex;align-items:center;gap:30px;transform:translateY(-26px) scale(1.04)}
.icon{width:108px;height:108px;border-radius:26px;box-shadow:0 14px 34px rgba(27,20,92,.30),inset 0 0 0 1px rgba(255,255,255,.26)}
.brand h1{margin:0 0 8px;font-size:33px;letter-spacing:4px;font-weight:800;text-shadow:0 4px 18px rgba(28,18,94,.28)}
.brand p{margin:0;color:rgba(255,255,255,.86);font-size:13px;letter-spacing:4.6px}

/* 进入按钮：唯一的交互入口，点击后才打开工作台 */
.enter{position:absolute;left:0;right:0;bottom:64px;z-index:2;display:flex;justify-content:center;-webkit-app-region:no-drag}
.enter button{
  appearance:none;border:0;outline:0;cursor:pointer;
  padding:11px 34px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:2.5px;
  color:#3d2a9e;background:#fff;
  box-shadow:0 10px 26px rgba(24,16,86,.34);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
  font-family:inherit;
}
.enter button:hover{transform:translateY(-2px);background:#fff;box-shadow:0 14px 32px rgba(24,16,86,.42)}
.enter button:active{transform:translateY(0) scale(.985)}
/* 只有键盘 Tab 到达时才显示焦点环；鼠标操作后不留任何边 */
.enter button:focus{outline:0}
.enter button:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:3px}
.enter .hint{margin-top:9px;text-align:center;font-size:11px;color:rgba(255,255,255,.62);letter-spacing:1.2px}
.enter-inner{display:flex;flex-direction:column;align-items:center}

/* 就绪前按钮不可点，避免工作台还没起来就点 */
.enter button[disabled]{opacity:.55;cursor:default;box-shadow:none;transform:none}

.status{position:absolute;left:0;right:0;bottom:22px;z-index:1;text-align:center;font-size:11.5px;color:rgba(255,255,255,.55);letter-spacing:1.4px}
/* 点击「进入工作台」后的淡出：与主窗交接时不露底色 */
.wrap,.enter,.status{transition:opacity .24s ease}
body.zp-leaving .wrap,body.zp-leaving .enter,body.zp-leaving .status{opacity:0}
@media (prefers-reduced-motion:reduce){.enter button{transition:none}.wrap,.enter,.status{transition:none}}
</style>
</head>
<body><div class="wrap">
  <div class="main">
    <img class="icon" src="../assets/app-icon.png" alt="紫微星图标">
    <div class="brand"><h1>紫微星</h1><p>文殊曲星 照亮每一稿</p></div>
  </div>

  <div class="enter">
    <div class="enter-inner">
      <button id="btnEnter" disabled>进入工作台</button>
      <div class="hint" id="hint">正在加载…</div>
    </div>
  </div>

  <div class="status">紫微星 · AI 批改工作台</div>
</div>
<script>
(function () {
  var btn = document.getElementById('btnEnter');
  var hint = document.getElementById('hint');
  var ready = false;

  /* 主进程在渲染进程 ready 后发来 ready，按钮才可点 */
  if (window.zpSplash) {
    window.zpSplash.onReady(function () {
      ready = true;
      btn.disabled = false;
      startAutoEnter();
    });
  }

  /* 3 秒自动进入：就绪后开始倒计时，超时自动进工作台；
   * 用户提前点击则立即进入，并取消倒计时。 */
  var AUTO_MS = 3000;
  var autoTimer = null;
  var countTimer = null;

  function enter(byAuto) {
    if (!ready || btn.disabled) return;
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    if (countTimer) { clearInterval(countTimer); countTimer = null; }
    btn.disabled = true;
    hint.textContent = byAuto ? '正在进入…' : '正在打开…';
    if (window.zpSplash && window.zpSplash.enter) {
      window.zpSplash.enter();
    } else {
      // 兜底（例如直接浏览器打开这个文件）：恢复可用，保持开屏
      btn.disabled = false;
      hint.textContent = '3 秒后自动进入，也可直接点击';
    }
  }

  function startAutoEnter() {
    var left = Math.ceil(AUTO_MS / 1000);
    hint.textContent = left + ' 秒后自动进入，也可直接点击';
    countTimer = setInterval(function () {
      left -= 1;
      if (left > 0) {
        hint.textContent = left + ' 秒后自动进入，也可直接点击';
      } else {
        clearInterval(countTimer);
        countTimer = null;
      }
    }, 1000);
    autoTimer = setTimeout(function () { enter(true); }, AUTO_MS);
  }

  if (window.zpSplash && window.zpSplash.onFade) {
    window.zpSplash.onFade(function () { document.body.classList.add('zp-leaving'); });
  }

  btn.addEventListener('click', function () { enter(false); });
  // 回车/空格也等同点击，键盘用户不必摸鼠标
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(false); }
  });
})();
</script>
</body>
</html>
