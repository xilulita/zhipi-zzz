<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智批作文</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:transparent}
.wrap{position:relative;width:100%;height:100%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 24% 12%,rgba(255,255,255,.18),transparent 30%),linear-gradient(135deg,#3836a8 0%,#5a46ce 46%,#8c5ce2 100%);border:1px solid rgba(255,255,255,.16);border-radius:24px;overflow:hidden;box-shadow:0 22px 70px rgba(30,24,92,.38)}
.wrap:before,.wrap:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}
.wrap:before{width:280px;height:280px;right:-110px;top:-130px;background:rgba(255,255,255,.11)}
.wrap:after{width:240px;height:240px;left:-120px;bottom:-130px;background:rgba(34,25,111,.26)}
.main{position:relative;z-index:1;display:flex;align-items:center;gap:30px;transform:translateY(-6px) scale(1.07)}
.icon{width:112px;height:112px;border-radius:28px;box-shadow:0 14px 34px rgba(27,20,92,.30),inset 0 0 0 1px rgba(255,255,255,.26)}
.brand h1{margin:0 0 8px;font-size:34px;letter-spacing:4px;font-weight:800;text-shadow:0 4px 18px rgba(28,18,94,.28)}
.brand p{margin:0;color:rgba(255,255,255,.86);font-size:13.5px;letter-spacing:5px}
.status{position:absolute;left:0;right:0;bottom:46px;z-index:1;text-align:center;font-size:12px;color:rgba(255,255,255,.80);letter-spacing:1.5px}
.bar{width:190px;height:3px;margin:10px auto 0;border-radius:9px;background:rgba(255,255,255,.17);overflow:hidden}
.bar i{display:block;width:42%;height:100%;border-radius:9px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:load 1.15s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}
</style>
</head>
<body><div class="wrap">
  <div class="main">
    <img class="icon" src="../assets/app-icon.png" alt="智批作文图标">
    <div class="brand"><h1>智批作文</h1><p>让每一次修改都有方向</p></div>
  </div>
  <div class="status">正在准备批改工作台<div class="bar"><i></i></div></div>
</div></body>
</html>
